<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <!-- <meta http-equiv="X-Frame-Options" content="DENY"> -->
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <title data-i18n="system_title">نظام حجز المواعيد للموظفين</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 data-i18n="system_title"><i class="fas fa-calendar-alt"></i> نظام حجز المواعيد للموظفين</h1>
            <p data-i18n="system_subtitle">Employee Scheduling System</p>
        </header>

        <!-- Authentication Section -->
        <div id="auth-section" class="auth-section">
            <div class="auth-container">
                <div class="auth-tabs">
                    <button class="auth-tab-btn active" data-auth="login" title="login">
                        <i class="fas fa-sign-in-alt"></i> <span data-i18n="login"></span>
                    </button>
                    <button class="auth-tab-btn" data-auth="register" title="register_account">
                        <i class="fas fa-user-plus"></i> <span data-i18n="register_account"></span>
                    </button>
                </div>

                <!-- Login Form -->
                <div class="auth-content active" id="login-content">
                    <form id="loginForm" class="auth-form">
                        <div class="form-group">
                            <label for="loginUsername" data-i18n="username"></label>
                            <input type="text" id="loginUsername" required placeholder="username" data-i18n-placeholder="username_placeholder">
                        </div>
                        <div class="form-group">
                            <label for="loginPassword" data-i18n="password"></label>
                            <input type="password" id="loginPassword" required placeholder="password" data-i18n-placeholder="password_placeholder">
                        </div>
                        <button type="submit" class="btn btn-primary" title="login">
                            <i class="fas fa-sign-in-alt"></i> <span data-i18n="login"></span>
                        </button>
                    </form>
                </div>

                <!-- Register Form -->
                <div class="auth-content" id="register-content">
                    <form id="registerForm" class="auth-form">
                        <div class="form-group">
                            <label for="registerUsername" data-i18n="username"></label>
                            <input type="text" id="registerUsername" required placeholder="username" data-i18n-placeholder="username_placeholder">
                        </div>
                        <div class="form-group">
                            <label for="registerEmail" data-i18n="email"></label>
                            <input type="email" id="registerEmail" placeholder="email" data-i18n-placeholder="email_placeholder">
                        </div>
                        <div class="form-group">
                            <label for="registerPassword" data-i18n="password"></label>
                            <input type="password" id="registerPassword" required placeholder="password" data-i18n-placeholder="password_placeholder">
                        </div>
                        <div class="form-group">
                            <label for="registerRole" data-i18n="role"></label>
                            <select id="registerRole" required title="role">
                                <option value="employee" data-i18n="employee"></option>
                                <option value="admin" data-i18n="admin"></option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary" title="register_account">
                            <i class="fas fa-user-plus"></i> <span data-i18n="register_account"></span>
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Main Application Section (hidden until authenticated) -->
        <div id="app-section" class="app-section app-section-hidden">
            <!-- User Info Bar -->
            <div class="user-info-bar">
                <div class="user-info">
                    <span id="userDisplayName" data-i18n="welcome_user">Hello</span>
                    <span id="userRole" class="user-role"></span>
                </div>
                <button id="logoutBtn" class="btn btn-danger" title="logout">
                    <i class="fas fa-sign-out-alt"></i> <span data-i18n="logout"></span>
                </button>
            </div>

            <nav class="nav-tabs">
                <button class="tab-btn active" data-tab="employee" title="new_appointment">
                    <i class="fas fa-user"></i> <span data-i18n="new_appointment"></span>
                </button>
                <button class="tab-btn admin-tab-hidden" data-tab="admin" id="adminTab" title="admin_panel">
                    <i class="fas fa-user-shield"></i> <span data-i18n="admin_panel"></span>
                </button>
                <button class="tab-btn" data-tab="dashboard" title="dashboard">
                    <i class="fas fa-chart-bar"></i> <span data-i18n="dashboard"></span>
                </button>
                <button class="tab-btn" data-tab="profile" title="profile">
                    <i class="fas fa-user-cog"></i> <span data-i18n="profile"></span>
                </button>
            </nav>

            <!-- Employee Booking Tab -->
            <div class="tab-content active" id="employee-tab">
                <div class="booking-form">
                    <h2><i class="fas fa-plus-circle"></i> <span data-i18n="new_appointment"></span></h2>
                    <form id="appointmentForm">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="employeeName" data-i18n="employee_name"></label>
                                <input type="text" id="employeeName" required placeholder="employee_name" data-i18n-placeholder="employee_name_placeholder">
                            </div>
                            <div class="form-group">
                                <label for="employeeId" data-i18n="employee_id"></label>
                                <input type="text" id="employeeId" required placeholder="employee_id" data-i18n-placeholder="employee_id_placeholder">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="department" data-i18n="department" class="visually-hidden"></label>
                                <select id="department" required title="department">
                                    <option value="" data-i18n="select_department"></option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="location" data-i18n="location"></label>
                                <select id="location" required title="location">
                                    <option value="" data-i18n="select_location"></option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="title" data-i18n="appointment_title"></label>
                            <input type="text" id="title" placeholder="appointment_title" required data-i18n-placeholder="appointment_title_placeholder">
                        </div>

                        <div class="form-group">
                            <label for="description" data-i18n="appointment_description"></label>
                            <textarea id="description" rows="3" placeholder="appointment_description" data-i18n-placeholder="appointment_description_placeholder"></textarea>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="requestedDate" data-i18n="requested_date"></label>
                                <input type="date" id="requestedDate" required placeholder="requested_date" title="requested_date">
                            </div>
                            <div class="form-group">
                                <label for="requestedTime" data-i18n="requested_time"></label>
                                <input type="time" id="requestedTime" required placeholder="requested_time" title="requested_time">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary" title="submit_request">
                            <i class="fas fa-paper-plane"></i> <span data-i18n="submit_request"></span>
                        </button>
                    </form>
                </div>

                <div class="my-appointments">
                    <h3><i class="fas fa-list"></i> <span data-i18n="my_appointments"></span></h3>
                    <div id="myAppointmentsList" class="appointments-list">
                        <!-- Appointments will be loaded here -->
                    </div>
                </div>
            </div>

            <!-- Admin Panel Tab -->
            <div class="tab-content" id="admin-tab">
                <div class="admin-header">
                    <h2><i class="fas fa-user-shield"></i> <span data-i18n="admin_panel"></span></h2>
                    <div class="status-filters">
                        <button class="status-btn active" data-status="all">الكل</button>
                        <button class="status-btn" data-status="pending">في الانتظار</button>
                        <button class="status-btn" data-status="approved">مقبول</button>
                        <button class="status-btn" data-status="rejected">مرفوض</button>
                        <button class="status-btn" data-status="done">مكتمل</button>
                        <button class="status-btn" data-status="missed">فات</button>
                    </div>
                </div>

                <div class="appointments-container">
                    <div id="adminAppointmentsList" class="appointments-list">
                        <!-- Admin appointments will be loaded here -->
                    </div>
                </div>
            </div>

            <!-- Dashboard Tab -->
            <div class="tab-content" id="dashboard-tab">
                <div class="dashboard-header">
                    <h2><i class="fas fa-chart-bar"></i> <span data-i18n="dashboard"></span></h2>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon pending">
                            <i class="fas fa-clock"></i>
                        </div>
                        <div class="stat-content">
                            <h3 id="pendingCount">0</h3>
                            <p data-i18n="pending_appointments">في الانتظار</p>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-icon approved">
                            <i class="fas fa-check-circle"></i>
                        </div>
                        <div class="stat-content">
                            <h3 id="approvedCount">0</h3>
                            <p data-i18n="approved_appointments">مقبول</p>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-icon rejected">
                            <i class="fas fa-times-circle"></i>
                        </div>
                        <div class="stat-content">
                            <h3 id="rejectedCount">0</h3>
                            <p data-i18n="rejected_appointments">مرفوض</p>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-icon done">
                            <i class="fas fa-check-double"></i>
                        </div>
                        <div class="stat-content">
                            <h3 id="doneCount">0</h3>
                            <p data-i18n="completed_appointments">مكتمل</p>
                        </div>
                    </div>
                </div>

                <div class="recent-appointments">
                    <h3><i class="fas fa-history"></i> <span data-i18n="recent_appointments"></span></h3>
                    <div id="recentAppointmentsList" class="appointments-list">
                        <!-- Recent appointments will be loaded here -->
                    </div>
                </div>
            </div>

            <!-- Profile Tab -->
            <div class="tab-content" id="profile-tab">
                <div class="profile-header">
                    <h2><i class="fas fa-user-cog"></i> <span data-i18n="profile"></span></h2>
                </div>

                <div class="profile-content">
                    <form id="profileForm" class="profile-form">
                        <div class="form-group">
                            <label for="profileUsername" data-i18n="username"></label>
                            <input type="text" id="profileUsername" readonly placeholder="username" title="username">
                        </div>
                        <div class="form-group">
                            <label for="profileEmail" data-i18n="email"></label>
                            <input type="email" id="profileEmail" placeholder="email" title="email">
                        </div>
                        <div class="form-group">
                            <label for="profileDepartment" data-i18n="department"></label>
                            <select id="profileDepartment" title="department">
                                <option value="" data-i18n="select_department"></option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary" title="save_changes">
                            <i class="fas fa-save"></i> <span data-i18n="save_changes"></span>
                        </button>
                    </form>

                    <div class="change-password-section">
                        <h3><i class="fas fa-key"></i> <span data-i18n="change_password"></span></h3>
                        <form id="changePasswordForm" class="password-form">
                            <div class="form-group">
                                <label for="currentPassword" data-i18n="current_password"></label>
                                <input type="password" id="currentPassword" required placeholder="current_password" title="current_password">
                            </div>
                            <div class="form-group">
                                <label for="newPassword" data-i18n="new_password"></label>
                                <input type="password" id="newPassword" required placeholder="new_password" title="new_password">
                            </div>
                            <div class="form-group">
                                <label for="confirmPassword" data-i18n="confirm_password"></label>
                                <input type="password" id="confirmPassword" required placeholder="confirm_password" title="confirm_password">
                            </div>
                            <button type="submit" class="btn btn-warning" title="change_password">
                                <i class="fas fa-key"></i> <span data-i18n="change_password"></span>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for appointment details -->
    <div id="appointmentModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="modalContent">
                <!-- Modal content will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Modal for admin approval/rejection -->
    <div id="adminModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3 id="adminModalTitle" data-i18n="update_appointment_status">تحديث حالة الموعد</h3>
            <form id="adminForm">
                <input type="hidden" id="appointmentId">
                <div class="form-group">
                    <label for="statusSelect" data-i18n="status"></label>
                    <select id="statusSelect" required title="status">
                        <option value="approved" data-i18n="accept">قبول</option>
                        <option value="rejected" data-i18n="reject">رفض</option>
                        <option value="done" data-i18n="complete">مكتمل</option>
                        <option value="missed" data-i18n="missed">فات</option>
                    </select>
                </div>
                <div class="form-group hidden" id="approvedDateGroup">
                    <label for="approvedDate" data-i18n="approved_date"></label>
                    <input type="date" id="approvedDate" placeholder="approved_date" title="approved_date">
                </div>
                <div class="form-group hidden" id="approvedTimeGroup">
                    <label for="approvedTime" data-i18n="approved_time"></label>
                    <input type="time" id="approvedTime" placeholder="approved_time" title="approved_time">
                </div>
                <div class="form-group hidden" id="rejectionReasonGroup">
                    <label for="rejectionReason" data-i18n="rejection_reason" class="visually-hidden">Rejection Reason</label>
                    <textarea id="rejectionReason" rows="3" placeholder="rejection_reason" title="rejection_reason"></textarea>
                </div>
                <div class="form-group">
                    <label for="adminNotes" data-i18n="admin_notes" class="visually-hidden">Admin Notes</label>
                    <textarea id="adminNotes" rows="3" placeholder="admin_notes" title="admin_notes"></textarea>
                </div>
                <button type="submit" class="btn btn-primary" title="update_status">
                    <i class="fas fa-sync-alt"></i> <span data-i18n="update_status"></span>
                </button>
            </form>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>

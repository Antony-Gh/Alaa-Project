<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <!-- <meta http-equiv="X-Frame-Options" content="DENY"> -->
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <title data-i18n="system_title">نظام حجز المواعيد للموظفين</title>
    <!-- <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>"
    /> -->
    <link rel="icon" type="image/x-icon" href="icons/favicon.ico" />
    <link rel="stylesheet" href="styles/main.css?v=__APP_VERSION__" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <!-- Header with Language Switcher -->
    <header class="main-header">
      <div class="header-content">
        <div class="header-left">
          <h1 class="header-title" data-i18n="system_title">
            <i class="fas fa-calendar-alt"></i> نظام حجز المواعيد للموظفين
          </h1>
          <p class="header-subtitle" data-i18n="system_subtitle">
            Employee Scheduling System
          </p>
        </div>
        <div class="header-right">
          <div id="languageSwitcher" class="language-switcher">
            <!-- Language switcher will be inserted here by JavaScript -->
          </div>
        </div>
      </div>
    </header>

    <div class="container">
      <!-- Message Container (Fixed Position) -->
      <div id="messageContainer" class="message-container"></div>

      <!-- Authentication Section -->
      <div id="auth-section" class="auth-section">
        <div class="auth-container">
          <div class="auth-tabs">
            <button class="auth-tab-btn active" data-auth="login" title="login">
              <i class="fas fa-sign-in-alt"></i> <span data-i18n="login"></span>
            </button>
            <button
              class="auth-tab-btn"
              data-auth="register"
              title="register_account"
            >
              <i class="fas fa-user-plus"></i>
              <span data-i18n="register_account"></span>
            </button>
          </div>

          <!-- Login Form -->
          <div class="auth-content active" id="login-content">
            <form id="loginForm" class="auth-form">
              <div class="form-group">
                <label for="login_username" data-i18n="username"></label>
                <input
                  type="text"
                  id="login_username"
                  name="username"
                  required
                  placeholder="username"
                  data-i18n-placeholder="username_placeholder"
                  autocomplete="username"
                />
              </div>
              <div class="form-group">
                <label for="login_password" data-i18n="password_title"></label>
                <div class="password-field-container">
                  <input
                    type="password"
                    id="login_password"
                    name="password"
                    required
                    placeholder="password"
                    data-i18n-placeholder="password_placeholder"
                    autocomplete="current-password"
                  />
                  <button
                    type="button"
                    class="password-toggle-btn"
                    id="login_password_toggle"
                    title="Toggle password visibility"
                  >
                    <i class="fas fa-eye"></i>
                  </button>
                </div>
              </div>
              <button type="submit" class="btn btn-primary" title="login">
                <i class="fas fa-sign-in-alt"></i>
                <span data-i18n="login"></span>
              </button>
            </form>
          </div>

          <!-- Register Form -->
          <div class="auth-content" id="register-content">
            <form id="registerForm" class="auth-form">
              <div class="form-group">
                <label for="register_username" data-i18n="username"></label>
                <input
                  type="text"
                  id="register_username"
                  name="username"
                  required
                  placeholder="username"
                  data-i18n-placeholder="username_placeholder"
                  autocomplete="username"
                />
              </div>
              <div class="form-group">
                <label for="register_email" data-i18n="email"></label>
                <input
                  type="email"
                  id="register_email"
                  name="email"
                  placeholder="email"
                  data-i18n-placeholder="email_placeholder"
                  autocomplete="email"
                />
              </div>
              <div class="form-group">
                <label for="register_full_name" data-i18n="full_name"
                  >Full Name</label
                >
                <input
                  type="text"
                  id="register_full_name"
                  name="full_name"
                  required
                  placeholder="full_name"
                  data-i18n-placeholder="full_name_placeholder"
                  autocomplete="name"
                />
              </div>
              <div class="form-group">
                <label for="register_phone" data-i18n="phone">Phone</label>
                <input
                  type="tel"
                  id="register_phone"
                  name="phone"
                  placeholder="phone"
                  data-i18n-placeholder="phone_placeholder"
                  autocomplete="tel"
                />
              </div>
              <div class="form-group">
                <label
                  for="register_password"
                  data-i18n="password_title"
                ></label>
                <div class="password-field-container">
                  <input
                    type="password"
                    id="register_password"
                    name="password"
                    required
                    placeholder="password"
                    data-i18n-placeholder="password_placeholder"
                    autocomplete="new-password"
                  />
                  <button
                    type="button"
                    class="password-generator-btn"
                    id="password_generator_btn"
                    title="Generate strong password"
                  >
                    <i class="fas fa-magic"></i>
                  </button>
                  <button
                    type="button"
                    class="password-toggle-btn"
                    id="register_password_toggle"
                    title="Toggle password visibility"
                  >
                    <i class="fas fa-eye"></i>
                  </button>
                </div>
                <div
                  class="password-strength empty"
                  id="password_strength"
                ></div>
              </div>
              <div class="form-group">
                <label
                  for="register_password_confirmation"
                  data-i18n="confirm_password"
                ></label>
                <div class="password-field-container">
                  <input
                    type="password"
                    id="register_password_confirmation"
                    name="password_confirmation"
                    required
                    placeholder="confirm_password"
                    data-i18n-placeholder="confirm_password_placeholder"
                    autocomplete="new-password"
                  />
                  <button
                    type="button"
                    class="password-toggle-btn"
                    id="register_password_confirmation_toggle"
                    title="Toggle password visibility"
                  >
                    <i class="fas fa-eye"></i>
                  </button>
                </div>
                <div class="password-match empty" id="passwordMatch"></div>
              </div>
              <div class="form-group">
                <label for="register_department" data-i18n="department"></label>
                <select
                  id="register_department"
                  name="department_id"
                  title="department"
                >
                  <option value="" data-i18n="select_department"></option>
                </select>
              </div>
              <!-- Role selection removed - all new registrations are employees by default -->
              <!-- <div class="form-group">
                <label for="registerRole" data-i18n="role"></label>
                <select id="registerRole" name="role" required title="role">
                  <option value="employee" data-i18n="employee"></option>
                  <option value="admin" data-i18n="admin"></option>
                </select>
              </div> -->
              <button
                type="submit"
                class="btn btn-primary"
                title="register_account"
              >
                <i class="fas fa-user-plus"></i>
                <span data-i18n="register_account"></span>
              </button>
            </form>
          </div>
        </div>
      </div>

      <!-- Main Application Section (hidden until authenticated) -->
      <div id="app-section" class="app-section app-section-hidden">
        <!-- User Info Bar -->
        <div class="user-info-bar">
          <div class="user-info">
            <div>
              <span data-i18n="welcome_user">مرحباً {username}</span>
                          <span id="userDisplayName">Anthony</span>
          </div>
          <span id="userRoleDisplay" class="user-role"></span>
          </div>
          <button id="logoutBtn" class="btn btn-danger" title="logout">
            <i class="fas fa-sign-out-alt"></i> <span data-i18n="logout"></span>
          </button>
        </div>

        <nav class="nav-tabs">
          <button
            class="tab-btn active"
            data-tab="employee"
            data-tab-name="new_appointment"
            title="new_appointment"
          >
            <i class="fas fa-user"></i>
            <span data-i18n="new_appointment"></span>
          </button>
          <button
            class="tab-btn admin-tab-hidden"
            data-tab="admin"
            id="adminTab"
            data-tab-name="admin_panel"
            title="admin_panel"
          >
            <i class="fas fa-user-shield"></i>
            <span data-i18n="admin_panel"></span>
          </button>
          <button
            class="tab-btn admin-moderator-tab-hidden"
            data-tab="user-management"
            id="userManagementTab"
            data-tab-name="user_management"
            title="user_management"
          >
            <i class="fas fa-users-cog"></i>
            <span data-i18n="user_management"></span>
          </button>
          <button
            class="tab-btn"
            data-tab="dashboard"
            data-tab-name="dashboard"
            title="dashboard"
          >
            <i class="fas fa-chart-bar"></i> <span data-i18n="dashboard"></span>
          </button>
          <button
            class="tab-btn"
            data-tab="profile"
            data-tab-name="profile"
            title="profile"
          >
            <i class="fas fa-user-cog"></i> <span data-i18n="profile"></span>
          </button>
        </nav>

        <!-- Employee Booking Tab -->
        <div
          class="tab-content active"
          data-tab-content="new_appointment"
          id="employee-tab"
        >
          <div class="booking-form">
            <h2>
              <i class="fas fa-plus-circle"></i>
              <span data-i18n="new_appointment"></span>
            </h2>
            <form id="appointmentForm">
              <div class="form-row">
                <div class="form-group">
                  <label for="employee_name" data-i18n="employee_name"></label>
                  <input
                    type="text"
                    id="employee_name"
                    name="employee_name"
                    required
                    placeholder="employee_name"
                    data-i18n-placeholder="employee_name_placeholder"
                  />
                </div>
                <div class="form-group">
                  <label for="employee_id" data-i18n="employee_id"></label>
                  <input
                    type="text"
                    id="employee_id"
                    name="employee_id"
                    required
                    placeholder="employee_id"
                    data-i18n-placeholder="employee_id_placeholder"
                  />
                </div>
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label for="department" data-i18n="department"></label>
                  <select
                    id="department"
                    name="department"
                    required
                    title="department"
                  >
                    <option value="" data-i18n="select_department"></option>
                  </select>
                </div>
                <div class="form-group">
                  <label for="location" data-i18n="location"></label>
                  <select
                    id="location"
                    name="location"
                    required
                    title="location"
                  >
                    <option value="" data-i18n="select_location"></option>
                  </select>
                </div>
              </div>

              <div class="form-group">
                <label for="title" data-i18n="appointment_title"></label>
                <input
                  type="text"
                  id="title"
                  name="title"
                  placeholder="appointment_title"
                  required
                  data-i18n-placeholder="appointment_title_placeholder"
                />
              </div>

              <div class="form-group">
                <label
                  for="description"
                  data-i18n="appointment_description"
                ></label>
                <textarea
                  id="description"
                  name="description"
                  rows="3"
                  placeholder="appointment_description"
                  data-i18n-placeholder="appointment_description_placeholder"
                ></textarea>
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label
                    for="requested_date"
                    data-i18n="requested_date"
                  ></label>
                  <input
                    type="date"
                    id="requested_date"
                    name="requested_date"
                    required
                    placeholder="requested_date"
                    title="requested_date"
                  />
                </div>
                <div class="form-group">
                  <label
                    for="requested_time"
                    data-i18n="requested_time"
                  ></label>
                  <input
                    type="time"
                    id="requested_time"
                    name="requested_time"
                    required
                    placeholder="requested_time"
                    title="requested_time"
                  />
                </div>
              </div>

              <div class="centered-item-row mt-3">
                <button
                  type="submit"
                  class="btn btn-primary"
                  title="submit_request"
                >
                  <i class="fas fa-paper-plane"></i>
                  <span data-i18n="submit_request"></span>
                </button>
              </div>
            </form>
          </div>

          <div class="my-appointments">
            <h3 class="mb-1">
              <i class="fas fa-list"></i>
              <span data-i18n="my_appointments"></span>
            </h3>
            <div id="myAppointmentsList" class="appointments-list">
              <!-- Appointments will be loaded here -->
            </div>
          </div>
        </div>

        <!-- Admin Panel Tab -->
        <div class="tab-content" data-tab-content="admin_panel" id="admin-tab">
          <div class="admin-header">
            <h2>
              <i class="fas fa-user-shield"></i>
              <span data-i18n="admin_panel"></span>
            </h2>
            <div class="status-filters">
              <button class="status-btn active" data-status="all">الكل</button>
              <button class="status-btn" data-status="pending">
                في الانتظار
              </button>
              <button class="status-btn" data-status="approved">مقبول</button>
              <button class="status-btn" data-status="rejected">مرفوض</button>
              <button class="status-btn" data-status="done">مكتمل</button>
              <button class="status-btn" data-status="missed">فات</button>
            </div>
          </div>

          <div class="appointments-container">
            <div id="adminAppointmentsList" class="appointments-list">
              <!-- Admin appointments will be loaded here -->
            </div>
          </div>
        </div>

        <!-- User Management Tab -->
        <div
          class="tab-content"
          data-tab-content="user_management"
          id="user-management-tab"
        >
          <div class="user-management-header">
            <h2>
              <i class="fas fa-users-cog"></i>
              <span data-i18n="user_management"></span>
            </h2>
            <button
              id="createUserBtn"
              class="btn btn-primary"
              title="create_user"
            >
              <i class="fas fa-user-plus"></i>
              <span data-i18n="create_user"></span>
            </button>
          </div>

          <div class="user-filters">
            <button class="role-filter-btn active" data-role="all">
              <span data-i18n="all_users">All Users</span>
            </button>
            <button
              class="role-filter-btn"
              data-role="moderator"
              id="moderatorFilterBtn"
            >
              <span data-i18n="moderators">Moderators</span>
            </button>
            <button
              class="role-filter-btn"
              data-role="employee"
              id="employeeFilterBtn"
            >
              <span data-i18n="employees">Employees</span>
            </button>
          </div>

          <div class="users-container">
            <div id="usersList" class="users-list">
              <!-- Users will be loaded here -->
            </div>
          </div>
        </div>

        <!-- Dashboard Tab -->
        <div
          class="tab-content"
          data-tab-content="dashboard"
          id="dashboard-tab"
        >
          <div class="dashboard-header">
            <h2>
              <i class="fas fa-chart-bar"></i>
              <span data-i18n="dashboard"></span>
            </h2>
          </div>

          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-icon pending">
                <i class="fas fa-clock"></i>
              </div>
              <div class="stat-content">
                <h3 id="pendingCount">0</h3>
                <p data-i18n="pending_appointments">في الانتظار</p>
              </div>
            </div>

            <div class="stat-card">
              <div class="stat-icon approved">
                <i class="fas fa-check-circle"></i>
              </div>
              <div class="stat-content">
                <h3 id="approvedCount">0</h3>
                <p data-i18n="approved_appointments">مقبول</p>
              </div>
            </div>

            <div class="stat-card">
              <div class="stat-icon rejected">
                <i class="fas fa-times-circle"></i>
              </div>
              <div class="stat-content">
                <h3 id="rejectedCount">0</h3>
                <p data-i18n="rejected_appointments">مرفوض</p>
              </div>
            </div>

            <div class="stat-card">
              <div class="stat-icon done">
                <i class="fas fa-check-double"></i>
              </div>
              <div class="stat-content">
                <h3 id="doneCount">0</h3>
                <p data-i18n="completed_appointments">مكتمل</p>
              </div>
            </div>
          </div>

          <!-- Calendar Section -->
          <div class="calendar-section">
            <div class="calendar-layout">
              <!-- Left Sidebar -->
              <div class="calendar-sidebar">
                <div class="sidebar-header">
                  <h3>
                    <i class="fas fa-calendar-alt"></i>
                    <span data-i18n="calendar">التقويم</span>
                  </h3>
                </div>

                <div class="create-event-section">
                  <button id="createEventBtn" class="btn btn-primary">
                    <i class="fas fa-plus"></i>
                    <span data-i18n="create_event">إنشاء موعد</span>
                  </button>
                </div>

                <div class="mini-calendar-section">
                  <div class="mini-calendar-header">
                    <button
                      id="miniPrevMonth"
                      class="btn btn-icon-small"
                      title="Previous Month"
                    >
                      <i class="fas fa-chevron-left"></i>
                    </button>
                    <h5 id="miniCurrentMonth">September 2024</h5>
                    <button
                      id="miniNextMonth"
                      class="btn btn-icon-small"
                      title="Next Month"
                    >
                      <i class="fas fa-chevron-right"></i>
                    </button>
                  </div>

                  <div class="mini-calendar">
                    <div class="mini-weekdays">
                      <div class="mini-weekday">S</div>
                      <div class="mini-weekday">M</div>
                      <div class="mini-weekday">T</div>
                      <div class="mini-weekday">W</div>
                      <div class="mini-weekday">T</div>
                      <div class="mini-weekday">F</div>
                      <div class="mini-weekday">S</div>
                    </div>
                    <div id="miniCalendarGrid" class="mini-calendar-grid">
                      <!-- Mini calendar days will be generated here -->
                    </div>
                  </div>
                </div>
              </div>

              <!-- Main Calendar -->
              <div class="main-calendar">
                <div class="main-calendar-header">
                  <div class="calendar-navigation">
                    <button
                      id="prevMonth"
                      class="btn btn-icon"
                      title="Previous Month"
                    >
                      <i class="fas fa-chevron-left"></i>
                    </button>
                    <button
                      id="todayBtn"
                      class="btn btn-secondary"
                      title="Go to Today"
                    >
                      <span data-i18n="today">اليوم</span>
                    </button>
                    <h4 id="currentMonth">September 2024</h4>
                    <button
                      id="nextMonth"
                      class="btn btn-icon"
                      title="Next Month"
                    >
                      <i class="fas fa-chevron-right"></i>
                    </button>
                  </div>
                </div>

                <div class="calendar-container">
                  <div class="calendar-weekdays">
                    <div class="weekday">Sun</div>
                    <div class="weekday">Mon</div>
                    <div class="weekday">Tue</div>
                    <div class="weekday">Wed</div>
                    <div class="weekday">Thu</div>
                    <div class="weekday">Fri</div>
                    <div class="weekday">Sat</div>
                  </div>
                  <div id="calendarGrid" class="calendar-grid">
                    <!-- Calendar days will be generated here -->
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="recent-appointments">
            <h3 class="mb-1">
              <i class="fas fa-history"></i>
              <span data-i18n="recent_appointments"></span>
            </h3>
            <div id="recentAppointmentsList" class="appointments-list">
              <!-- Recent appointments will be loaded here -->
            </div>
          </div>
        </div>

        <!-- Profile Tab -->
        <div class="tab-content" data-tab-content="profile" id="profile-tab">
          <div class="profile-header">
            <h2>
              <i class="fas fa-user-cog"></i> <span data-i18n="profile"></span>
            </h2>
          </div>

          <div class="profile-content">
            <div class="change-password-section">
              <h3>
                <i class="fas fa-user"></i>
                <span data-i18n="your_information"></span>
              </h3>
              <form id="profileForm" class="profile-form">
                <div class="form-group">
                  <label for="profileUsername" data-i18n="username"></label>
                  <input
                    type="text"
                    id="profileUsername"
                    name="username"
                    readonly
                    placeholder="username"
                    data-i18n-placeholder="username_placeholder"
                    title="username"
                    autocomplete="username"
                  />
                </div>
                <div class="form-group">
                  <label for="profileEmail" data-i18n="email"></label>
                  <input
                    type="email"
                    id="profileEmail"
                    name="email"
                    placeholder="email"
                    data-i18n-placeholder="email_placeholder"
                    title="email"
                    autocomplete="email"
                  />
                </div>
                <div class="form-group">
                  <label for="profileDepartment" data-i18n="department"></label>
                  <select
                    id="profileDepartment"
                    name="department"
                    title="department"
                  >
                    <option value="0" data-i18n="select_department"></option>
                  </select>
                </div>
                <div class="centered-item-row mt-2">
                  <button
                    type="submit"
                    class="btn btn-primary"
                    title="save_changes"
                  >
                    <i class="fas fa-save"></i>
                    <span data-i18n="save_changes"></span>
                  </button>
                </div>
              </form>
            </div>
            <div class="change-password-section">
              <h3>
                <i class="fas fa-key"></i>
                <span data-i18n="change_password"></span>
              </h3>
              <form id="changePasswordForm" class="password-form">
                <!-- Hidden username field for accessibility -->
                <input
                  type="text"
                  name="username"
                  value=""
                  class="visually-hidden"
                  tabindex="-1"
                  autocomplete="username"
                  aria-hidden="true"
                />
                <div class="form-group">
                  <label
                    for="currentPassword"
                    data-i18n="current_password"
                  ></label>
                  <div class="password-field-container">
                    <input
                      type="password"
                      id="currentPassword"
                      name="currentPassword"
                      required
                      placeholder="current_password_placeholder"
                      data-i18n-placeholder="current_password_placeholder"
                      title="current_password"
                      autocomplete="off"
                    />
                    <button
                      type="button"
                      class="password-toggle-btn"
                      id="currentPasswordToggle"
                      title="Toggle password visibility"
                    >
                      <i class="fas fa-eye"></i>
                    </button>
                  </div>
                </div>
                <div class="form-group">
                  <label for="new_password" data-i18n="new_password"></label>
                  <div class="password-field-container">
                    <input
                      type="password"
                      id="new_password"
                      name="new_password"
                      required
                      placeholder="new_password_placeholder"
                      data-i18n-placeholder="new_password_placeholder"
                      title="new_password"
                      autocomplete="new-password"
                    />
                    <button
                      type="button"
                      class="password-toggle-btn"
                      id="new_passwordToggle"
                      title="Toggle password visibility"
                    >
                      <i class="fas fa-eye"></i>
                    </button>
                  </div>
                </div>
                <div class="form-group">
                  <label
                    for="password_confirmation"
                    data-i18n="confirm_password"
                  ></label>
                  <div class="password-field-container">
                    <input
                      type="password"
                      id="password_confirmation"
                      name="password_confirmation"
                      required
                      placeholder="confirm_password_placeholder"
                      data-i18n-placeholder="confirm_password_placeholder"
                      title="confirm_password"
                      autocomplete="new-password"
                    />
                    <button
                      type="button"
                      class="password-toggle-btn"
                      id="password_confirmationToggle"
                      title="Toggle password visibility"
                    >
                      <i class="fas fa-eye"></i>
                    </button>
                  </div>
                </div>
                <div class="centered-item-row mt-2">
                  <button
                    type="submit"
                    class="btn btn-warning"
                    title="change_password"
                  >
                    <i class="fas fa-key"></i>
                    <span data-i18n="change_password"></span>
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal for appointment details -->
    <div id="appointmentModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <div id="modalContent">
          <!-- Modal content will be loaded here -->
        </div>
      </div>
    </div>

    <!-- Modal for admin approval/rejection -->
    <div id="adminModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h3 id="adminModalTitle" data-i18n="update_appointment_status">
          تحديث حالة الموعد
        </h3>
        <form id="adminForm">
          <input type="hidden" id="appointmentId" name="appointmentId" />
          <div class="form-group">
            <label for="statusSelect" data-i18n="status"></label>
            <select id="statusSelect" name="status" required title="status">
              <option value="approved" data-i18n="accept">قبول</option>
              <option value="rejected" data-i18n="reject">رفض</option>
              <option value="done" data-i18n="complete">مكتمل</option>
              <option value="missed" data-i18n="missed">فات</option>
            </select>
          </div>
          <div class="form-group hidden" id="approved_dateGroup">
            <label for="approved_date" data-i18n="approved_date"></label>
            <input
              type="date"
              id="approved_date"
              name="approved_date"
              placeholder="approved_date"
              title="approved_date"
            />
          </div>
          <div class="form-group hidden" id="approved_timeGroup">
            <label for="approved_time" data-i18n="approved_time"></label>
            <input
              type="time"
              id="approved_time"
              name="approved_time"
              placeholder="approved_time"
              title="approved_time"
            />
          </div>
          <div class="form-group hidden" id="rejection_reasonGroup">
            <label for="rejection_reason" data-i18n="rejection_reason"
              >Rejection Reason</label
            >
            <textarea
              id="rejection_reason"
              name="rejection_reason"
              rows="3"
              placeholder="rejection_reason"
              title="rejection_reason"
            ></textarea>
          </div>
          <div class="form-group">
            <label for="adminNotes" data-i18n="admin_notes">Admin Notes</label>
            <textarea
              id="adminNotes"
              name="adminNotes"
              rows="3"
              placeholder="admin_notes"
              data-i18n-placeholder="admin_notes"
              title="admin_notes"
            ></textarea>
          </div>
          <div class="centered-item-row mt-2">
            <button type="submit" class="btn btn-primary" title="update_status">
              <i class="fas fa-sync-alt"></i>
              <span data-i18n="update_status"></span>
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Modal for user creation/editing -->
    <div id="userModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h3 id="userModalTitle" data-i18n="create_user">Create User</h3>
        <form id="userForm">
          <input type="hidden" id="userId" name="userId" />
          <div class="form-group">
            <label for="userUsername" data-i18n="username"></label>
            <input
              type="text"
              id="userUsername"
              name="username"
              required
              placeholder="username"
              title="username"
              autocomplete="username"
            />
          </div>
          <div class="form-group">
            <label for="userEmail" data-i18n="email"></label>
            <input
              type="email"
              id="userEmail"
              name="email"
              placeholder="email"
              title="email"
              autocomplete="email"
            />
          </div>
          <div class="form-group">
            <label for="userFullName" data-i18n="full_name">Full Name</label>
            <input
              type="text"
              id="userFullName"
              name="full_name"
              placeholder="full_name"
              title="full_name"
              autocomplete="name"
            />
          </div>
          <div class="form-group">
            <label for="userRole" data-i18n="role"></label>
            <select id="userRole" name="role" required title="role" autocomplete="off">
              <option value="employee" data-i18n="employee"></option>
              <option value="manager" data-i18n="manager"></option>
              <option
                value="moderator"
                data-i18n="moderator"
                id="moderatorOption"
              ></option>
            </select>
          </div>
          <div class="form-group">
            <label for="userDepartment" data-i18n="department"></label>
            <select id="userDepartment" name="department_id" title="department">
              <option value="0" data-i18n="select_department"></option>
            </select>
          </div>
          <div class="form-group" id="userPasswordGroup">
            <label for="userPassword" data-i18n="password_title"></label>
            <div class="password-field-container">
              <input
                type="password"
                id="userPassword"
                name="password"
                placeholder="password"
                title="password"
                autocomplete="current-password"
              />
              <button
                type="button"
                class="password-toggle-btn"
                id="userPasswordToggle"
                title="Toggle password visibility"
              >
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>
          <div class="form-group">
            <label for="userIsActive" data-i18n="is_active">Active</label>
            <input
              type="checkbox"
              id="userIsActive"
              name="is_active"
              checked
              title="is_active"
            />
          </div>
          <button type="submit" class="btn btn-primary" title="save_user">
            <i class="fas fa-save"></i>
            <span data-i18n="save_user">Save User</span>
          </button>
        </form>
      </div>
    </div>

    <script type="module" src="scripts/utils/sanitize.js?v=__APP_VERSION__"></script>
    <script type="module" src="scripts/main.js?v=__APP_VERSION__"></script>
  </body>
</html>
